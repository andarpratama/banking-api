apiVersion: v1
kind: ServiceAccount
metadata:
  name: banking-api
  namespace: banking
  labels:
    app: banking-api
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: banking-api
  namespace: banking
  labels:
    app: banking-api
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: banking-api
  namespace: banking
  labels:
    app: banking-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: banking-api
subjects:
  - kind: ServiceAccount
    name: banking-api
    namespace: banking
