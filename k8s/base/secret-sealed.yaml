# Sealed Secrets placeholder — NOT included in kustomization.yaml (requires the
# bitnami-labs/sealed-secrets controller). Generate a real object with kubeseal:
#
#   kubectl apply -f https://github.com/bitnami-labs/sealed-secrets/releases/latest/download/controller.yaml
#   kubectl create secret generic banking-secrets \
#     --namespace banking \
#     --from-literal=db-password='...' \
#     --from-literal=redis-password='...' \
#     --from-literal=jwt-secret='...' \
#     --dry-run=client -o yaml \
#     | kubeseal -o yaml > k8s/base/secret-sealed.yaml
#
# Then add secret-sealed.yaml to the overlay kustomization and remove secretGenerator.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: banking-secrets
  namespace: banking
spec:
  template:
    metadata:
      name: banking-secrets
      namespace: banking
      labels:
        app: banking-api
    type: Opaque
  encryptedData:
    db-password: REPLACE_WITH_KUBESEAL_OUTPUT
    redis-password: REPLACE_WITH_KUBESEAL_OUTPUT
    jwt-secret: REPLACE_WITH_KUBESEAL_OUTPUT
