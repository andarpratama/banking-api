apiVersion: v1
kind: Secret
metadata:
  name: banking-secrets
  namespace: banking
  labels:
    app: banking-api
type: Opaque
stringData:
  db-password: REPLACE_WITH_ACTUAL_PASSWORD
  redis-password: REPLACE_WITH_ACTUAL_PASSWORD
  jwt-secret: REPLACE_WITH_ACTUAL_JWT_SECRET_MIN_32_CHARS
