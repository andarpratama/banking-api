# Scrape the API running on the Docker host (`mvn spring-boot:run -Dspring-boot.run.profiles=dev`).
# host.docker.internal is set via extra_hosts: host-gateway in docker-compose.dev.yml.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: banking-api
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets:
          - host.docker.internal:8080
        labels:
          service: banking-api
          env: dev
