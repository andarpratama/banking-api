groups:
  - name: banking-api-error-budget
    interval: 10s
    rules:
      # Multi-window error rates (same valid/5xx events as T-096 SLO-01/02).
      - record: banking:http_api:valid:rate30m
        expr: sum(rate(http_server_requests_seconds_count{uri=~"/api/v1/.*",uri!~"/api/v1/health.*",status!~"4.."}[30m]))
      - record: banking:http_api:5xx:rate30m
        expr: sum(rate(http_server_requests_seconds_count{uri=~"/api/v1/.*",uri!~"/api/v1/health.*",status=~"5.."}[30m]))
      - record: banking:sli:error_rate:ratio30m
        expr: banking:http_api:5xx:rate30m / clamp_min(banking:http_api:valid:rate30m, 1e-9)

      - record: banking:http_api:valid:rate1h
        expr: sum(rate(http_server_requests_seconds_count{uri=~"/api/v1/.*",uri!~"/api/v1/health.*",status!~"4.."}[1h]))
      - record: banking:http_api:5xx:rate1h
        expr: sum(rate(http_server_requests_seconds_count{uri=~"/api/v1/.*",uri!~"/api/v1/health.*",status=~"5.."}[1h]))
      - record: banking:sli:error_rate:ratio1h
        expr: banking:http_api:5xx:rate1h / clamp_min(banking:http_api:valid:rate1h, 1e-9)

      - record: banking:http_api:valid:rate6h
        expr: sum(rate(http_server_requests_seconds_count{uri=~"/api/v1/.*",uri!~"/api/v1/health.*",status!~"4.."}[6h]))
      - record: banking:http_api:5xx:rate6h
        expr: sum(rate(http_server_requests_seconds_count{uri=~"/api/v1/.*",uri!~"/api/v1/health.*",status=~"5.."}[6h]))
      - record: banking:sli:error_rate:ratio6h
        expr: banking:http_api:5xx:rate6h / clamp_min(banking:http_api:valid:rate6h, 1e-9)

      - record: banking:http_api:valid:rate24h
        expr: sum(rate(http_server_requests_seconds_count{uri=~"/api/v1/.*",uri!~"/api/v1/health.*",status!~"4.."}[24h]))
      - record: banking:http_api:5xx:rate24h
        expr: sum(rate(http_server_requests_seconds_count{uri=~"/api/v1/.*",uri!~"/api/v1/health.*",status=~"5.."}[24h]))
      - record: banking:sli:error_rate:ratio24h
        expr: banking:http_api:5xx:rate24h / clamp_min(banking:http_api:valid:rate24h, 1e-9)

      # Burn rate vs 0.1% availability budget (1.0 = exhausts the window exactly).
      - record: banking:error_budget:availability:burn5m
        expr: banking:sli:error_rate:ratio5m / 0.001
      - record: banking:error_budget:availability:burn30m
        expr: banking:sli:error_rate:ratio30m / 0.001
      - record: banking:error_budget:availability:burn1h
        expr: banking:sli:error_rate:ratio1h / 0.001
      - record: banking:error_budget:availability:burn6h
        expr: banking:sli:error_rate:ratio6h / 0.001
      - record: banking:error_budget:availability:burn24h
        expr: banking:sli:error_rate:ratio24h / 0.001

      # Remaining 24h budget (local TSDB). 1.0 = full; 0 = exhausted.
      - record: banking:error_budget:availability:remaining24h
        expr: clamp_min(1 - banking:sli:error_rate:ratio24h / 0.001, 0)

      - record: banking:error_budget:availability:hours_to_exhaustion
        expr: banking:error_budget:availability:remaining24h * 24 / clamp_min(banking:error_budget:availability:burn5m, 1e-9)

      # SLO-03: requests slower than 300 ms among successful /api/v1 (p99 ⇒ 1% budget).
      - record: banking:http_api:ok:rate5m
        expr: sum(rate(http_server_requests_seconds_count{uri=~"/api/v1/.*",uri!~"/api/v1/health.*",status=~"2.."}[5m]))
      - record: banking:http_api:fast300:rate5m
        expr: sum(rate(http_server_requests_seconds_bucket{uri=~"/api/v1/.*",uri!~"/api/v1/health.*",status=~"2..",le="0.3"}[5m]))
      - record: banking:sli:latency_slow:ratio5m
        expr: clamp_min(banking:http_api:ok:rate5m - banking:http_api:fast300:rate5m, 0) / clamp_min(banking:http_api:ok:rate5m, 1e-9)

      - record: banking:http_api:ok:rate1h
        expr: sum(rate(http_server_requests_seconds_count{uri=~"/api/v1/.*",uri!~"/api/v1/health.*",status=~"2.."}[1h]))
      - record: banking:http_api:fast300:rate1h
        expr: sum(rate(http_server_requests_seconds_bucket{uri=~"/api/v1/.*",uri!~"/api/v1/health.*",status=~"2..",le="0.3"}[1h]))
      - record: banking:sli:latency_slow:ratio1h
        expr: clamp_min(banking:http_api:ok:rate1h - banking:http_api:fast300:rate1h, 0) / clamp_min(banking:http_api:ok:rate1h, 1e-9)

      - record: banking:http_api:ok:rate24h
        expr: sum(rate(http_server_requests_seconds_count{uri=~"/api/v1/.*",uri!~"/api/v1/health.*",status=~"2.."}[24h]))
      - record: banking:http_api:fast300:rate24h
        expr: sum(rate(http_server_requests_seconds_bucket{uri=~"/api/v1/.*",uri!~"/api/v1/health.*",status=~"2..",le="0.3"}[24h]))
      - record: banking:sli:latency_slow:ratio24h
        expr: clamp_min(banking:http_api:ok:rate24h - banking:http_api:fast300:rate24h, 0) / clamp_min(banking:http_api:ok:rate24h, 1e-9)

      - record: banking:error_budget:latency:burn5m
        expr: banking:sli:latency_slow:ratio5m / 0.01
      - record: banking:error_budget:latency:burn1h
        expr: banking:sli:latency_slow:ratio1h / 0.01
      - record: banking:error_budget:latency:remaining24h
        expr: clamp_min(1 - banking:sli:latency_slow:ratio24h / 0.01, 0)
