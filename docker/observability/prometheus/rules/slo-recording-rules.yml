groups:
  - name: banking-api-sli
    interval: 10s
    rules:
      - record: banking:http_api:valid:rate5m
        expr: sum(rate(http_server_requests_seconds_count{uri=~"/api/v1/.*",uri!~"/api/v1/health.*",status!~"4.."}[5m]))
      - record: banking:http_api:good:rate5m
        expr: sum(rate(http_server_requests_seconds_count{uri=~"/api/v1/.*",uri!~"/api/v1/health.*",status=~"[23].."}[5m]))
      - record: banking:http_api:5xx:rate5m
        expr: sum(rate(http_server_requests_seconds_count{uri=~"/api/v1/.*",uri!~"/api/v1/health.*",status=~"5.."}[5m]))
      - record: banking:sli:availability:ratio5m
        expr: banking:http_api:good:rate5m / clamp_min(banking:http_api:valid:rate5m, 1e-9)
      - record: banking:sli:error_rate:ratio5m
        expr: banking:http_api:5xx:rate5m / clamp_min(banking:http_api:valid:rate5m, 1e-9)
      - record: banking:sli:latency_p99:seconds5m
        expr: histogram_quantile(0.99, sum by (le) (rate(http_server_requests_seconds_bucket{uri=~"/api/v1/.*",uri!~"/api/v1/health.*",status=~"2.."}[5m])))
      - record: banking:sli:latency_p99_money:seconds5m
        expr: histogram_quantile(0.99, sum by (le) (rate(http_server_requests_seconds_bucket{uri=~"/api/v1/transactions/(deposit|withdraw|transfer)",status=~"2.."}[5m])))
