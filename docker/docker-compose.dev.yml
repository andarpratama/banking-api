version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: banking-api-dev
    ports:
      - "8080:8080"
      - "5005:5005"  # Debug port
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/banking_api
      SPRING_DATASOURCE_USERNAME: banking_user
      SPRING_DATASOURCE_PASSWORD: SecurePassword123!
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      LOGGING_LEVEL_ROOT: DEBUG
      JAVA_DEBUG_OPTS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    volumes:
      - ..:/app
      - ~/.m2:/root/.m2  # Maven cache
    depends_on:
      - postgres
      - redis
    networks:
      - banking_network

  postgres:
    image: postgres:17-alpine
    container_name: banking-postgres-dev
    environment:
      POSTGRES_DB: banking_api
      POSTGRES_USER: banking_user
      POSTGRES_PASSWORD: SecurePassword123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - banking_network

  redis:
    image: redis:7-alpine
    container_name: banking-redis-dev
    ports:
      - "6379:6379"
    networks:
      - banking_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: banking-pgadmin-dev
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - banking_network

volumes:
  postgres_dev_data:
    driver: local

networks:
  banking_network:
    driver: bridge
