# T-101 local streaming replication. Mounted as hba_file on the primary overlay.
# Matches the official postgres image defaults, plus replication lines.
# Not for production — production uses a managed HA offering or CloudNativePG.

local   all             all                                     trust
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256
host    all             all             0.0.0.0/0               scram-sha-256
host    all             all             ::/0                    scram-sha-256
host    replication     replicator      0.0.0.0/0               scram-sha-256
host    replication     replicator      ::/0                    scram-sha-256
