spring:
  config:
    activate:
      on-profile: dev

  # Local defaults align with docker/docker-compose.dev.yml (Postgres + Redis on localhost)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/banking_api}
    username: ${SPRING_DATASOURCE_USERNAME:banking_user}
    password: ${SPRING_DATASOURCE_PASSWORD:SecurePassword123!}
    hikari:
      pool-name: banking-hikari-dev
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    # Dev-only: log SQL to catch missing indexes / N+1. Prod keeps show-sql: false.
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
          time_zone: UTC
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    # Include repeatable R__seed_dev_users.sql — never on prod.
    locations: classpath:db/migration,classpath:db/dev

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 2s

logging:
  level:
    root: INFO
    com.company.banking: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:${OTEL_SAMPLER_ARG:0.1}}

# Local FE defaults (Vite / CRA). Override with CORS_ALLOWED_ORIGINS (comma-separated).
app:
  rate-limit:
    # Prefer Redis when docker-compose.dev is up; override with RATE_LIMIT_BACKEND=memory if needed.
    backend: ${RATE_LIMIT_BACKEND:redis}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}
    allow-credentials: true

