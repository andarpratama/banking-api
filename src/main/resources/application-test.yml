spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:banking_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      pool-name: banking-hikari-test
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 20
          time_zone: UTC
        order_inserts: true
        order_updates: true
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  data:
    redis:
      timeout: 2s

logging:
  level:
    root: WARN
    com.company.banking: INFO
    org.springframework.web: INFO

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  cors:
    allowed-origins: http://localhost:3000
    allow-credentials: true
