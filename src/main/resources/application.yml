spring:
  application:
    name: banking-api
  # Shared placeholders — override via env / profile. No real secrets in repo.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:banking_api}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:banking_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:changeme}}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: banking-hikari
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:20000}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:300000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:1200000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 20
          time_zone: UTC
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: false
    # Schema + reference data only. Dev user seed lives in classpath:db/dev (profile=dev).
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
      port: ${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
      password: ${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD:}}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:2s}
  cache:
    # redis in runtime profiles; application-test.yml uses in-memory (simple)
    type: ${CACHE_TYPE:redis}
    cache-names:
      - customers
      - accounts
    redis:
      time-to-live: 10m
      cache-null-values: false

server:
  port: ${SERVER_PORT:8080}
  # API base path /api/v1 is applied via controller @RequestMapping (not servlet context-path)
  # gzip JSON/text responses > 1KB (client must send Accept-Encoding: gzip)
  compression:
    enabled: true
    min-response-size: 1024
    mime-types:
      - application/json
      - application/xml
      - text/html
      - text/xml
      - text/plain
      - text/css
      - application/javascript

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:${OTEL_SAMPLER_ARG:0.1}}
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
      percentiles:
        "[http.server.requests]":
          - 0.5
          - 0.95
          - 0.99

# OpenTelemetry Spring Boot starter (auto HTTP/JDBC). SDK bean is built in ObservabilityConfig.
otel:
  service:
    name: banking-api
  propagators: tracecontext
  instrumentation:
    micrometer:
      enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:change-me-dev-only-min-32-chars-long!!}
    access-token-expiration: ${JWT_EXPIRATION:3600}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800}
  rate-limit:
    enabled: true
    # redis (default, multi-instance) | memory (single-process / tests)
    backend: ${RATE_LIMIT_BACKEND:redis}
    global-limit: ${RATE_LIMIT_GLOBAL_LIMIT:100}
    global-window-seconds: ${RATE_LIMIT_GLOBAL_WINDOW_SECONDS:60}
    auth-limit: ${RATE_LIMIT_AUTH_LIMIT:20}
    auth-window-seconds: ${RATE_LIMIT_AUTH_WINDOW_SECONDS:60}
  feature-flags:
    # local (YAML map, default) | launchdarkly (requires LAUNCHDARKLY_SDK_KEY)
    provider: ${FEATURE_FLAGS_PROVIDER:local}
    sdk-key: ${LAUNCHDARKLY_SDK_KEY:}
    flags:
      new-account-flow: false
  logging:
    logstash:
      # UDP JSON to local Logstash (compose profile elk). Packets drop if ELK is not running.
      host: ${LOGSTASH_HOST:localhost}
      port: ${LOGSTASH_PORT:5000}
  observability:
    # OTLP gRPC to Jaeger all-in-one or Datadog Agent (native Jaeger exporter removed from OTel Java).
    enabled: ${OTEL_ENABLED:true}
    backend: ${OTEL_BACKEND:jaeger}
    endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:${OTEL_JAEGER_ENDPOINT:http://localhost:4317}}
    sampling-rate: ${OTEL_TRACES_SAMPLER_ARG:${OTEL_SAMPLER_ARG:0.1}}
    environment: ${OTEL_DEPLOYMENT_ENVIRONMENT:${DD_ENV:${SPRING_PROFILES_ACTIVE:dev}}}
    datadog-api-key: ${DD_API_KEY:}
  cors:
    # Origins: set via profile YAML (dev) or CORS_ALLOWED_ORIGINS (comma-separated).
    # Never use "*" when allow-credentials is true.
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
      - HEAD
    allowed-headers:
      - "*"
    allow-credentials: true
    max-age: 3600

