spring:
  application:
    name: banking-api
  # Shared placeholders — override via env / profile. No real secrets in repo.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:banking_api}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:banking_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:changeme}}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: banking-hikari
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:20000}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:300000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:1200000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 20
          time_zone: UTC
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: false
    # Schema + reference data only. Dev user seed lives in classpath:db/dev (profile=dev).
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
      port: ${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
      password: ${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD:}}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:2s}

server:
  port: ${SERVER_PORT:8080}
  # API base path /api/v1 is applied via controller @RequestMapping (not servlet context-path)

app:
  jwt:
    secret: ${JWT_SECRET:change-me-dev-only-min-32-chars-long!!}
    access-token-expiration-seconds: ${JWT_EXPIRATION:3600}
    refresh-token-expiration-seconds: ${JWT_REFRESH_EXPIRATION:604800}
  cors:
    # Origins: set via profile YAML (dev) or CORS_ALLOWED_ORIGINS (comma-separated).
    # Never use "*" when allow-credentials is true.
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
      - HEAD
    allowed-headers:
      - "*"
    allow-credentials: true
    max-age: 3600

