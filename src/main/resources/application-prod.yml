spring:
  config:
    activate:
      on-profile: prod

  # Prod requires env overrides — do not rely on local defaults
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    # Prod: schema/reference migrations only — no classpath:db/dev seed users.
    locations: classpath:db/migration

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    # Explicit production whitelist only — set CORS_ALLOWED_ORIGINS (comma-separated).
    # Do not use "*" with credentials. Empty/missing means no cross-origin access.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    allow-credentials: true

logging:
  level:
    root: WARN
    com.company.banking: INFO

management:
  endpoints:
    web:
      exposure:
        include: health
